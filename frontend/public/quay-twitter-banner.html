<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>quay. on Sui — Twitter banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    width: 1500px;
    height: 500px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #f4f6fb;
  }

  .banner {
    width: 1500px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background: #0a1024;
  }

  /* Aurora mesh — same orb positions, colors, and blur as globals.css body::before */
  .aurora {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(40% 36% at 18% 22%, rgba(56, 132, 222, 0.55), transparent 65%),
      radial-gradient(32% 30% at 82% 26%, rgba(168, 85, 247, 0.32), transparent 65%),
      radial-gradient(38% 34% at 50% 96%, rgba(56, 189, 248, 0.36), transparent 65%),
      radial-gradient(26% 24% at 92% 78%, rgba(244, 114, 182, 0.22), transparent 65%);
    filter: blur(60px) saturate(160%);
  }

  /* Grain — same SVG noise filter as globals.css body::after */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 1  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
    opacity: 0.07;
    mix-blend-mode: overlay;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .wordmark {
    font-size: 200px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -10px;
    color: #f4f6fb;
    /* slight nudge so the optical centre of "quay." sits at the banner centre */
    transform: translateX(-6px);
  }
  .wordmark .dot {
    color: #4DA2FF;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 14px 32px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.03) 100%);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.16) inset,
      0 -1px 0 rgba(0, 0, 0, 0.25) inset,
      0 4px 12px -4px rgba(0, 0, 0, 0.45);
    color: #f4f6fb;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .pill .on { /* trim trailing tracking so the gap between "ON" and the logo is controlled by flex `gap` */
    margin-right: -0.18em;
  }
  .sui-logo {
    width: 34px;
    height: 34px;
    display: block;
    filter: drop-shadow(0 0 12px rgba(77, 162, 255, 0.6));
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="aurora"></div>
    <div class="grain"></div>
    <div class="content">
      <div class="wordmark">quay<span class="dot">.</span></div>
      <div class="pill">
        <span class="on">On</span>
        <svg class="sui-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-label="Sui" role="img">
          <title>Sui</title>
          <path fill="#4DA2FF" d="M17.636 10.009a7.16 7.16 0 0 1 1.565 4.474 7.2 7.2 0 0 1-1.608 4.53l-.087.106-.023-.135a7 7 0 0 0-.07-.349c-.502-2.21-2.142-4.106-4.84-5.642-1.823-1.034-2.866-2.278-3.14-3.693-.177-.915-.046-1.834.209-2.62.254-.787.631-1.446.953-1.843l1.05-1.284a.46.46 0 0 1 .713 0l5.28 6.456zm1.66-1.283L12.26.123a.336.336 0 0 0-.52 0L4.704 8.726l-.023.029a9.33 9.33 0 0 0-2.07 5.872C2.612 19.803 6.816 24 12 24s9.388-4.197 9.388-9.373a9.32 9.32 0 0 0-2.07-5.871zM6.389 9.981l.63-.77.018.142q.023.17.055.34c.408 2.136 1.862 3.917 4.294 5.297 2.114 1.203 3.345 2.586 3.7 4.103a5.3 5.3 0 0 1 .109 1.801l-.004.034-.03.014A7.2 7.2 0 0 1 12 21.67c-3.976 0-7.2-3.218-7.2-7.188 0-1.705.594-3.27 1.587-4.503z"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
