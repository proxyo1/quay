<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>quay. — profile picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #f4f6fb;
  }

  .pfp {
    width: 1000px;
    height: 1000px;
    position: relative;
    overflow: hidden;
    background: #0a1024;
  }

  /* Aurora mesh — same orb positions, colors, blur as the banner / globals.css */
  .aurora {
    position: absolute;
    inset: -10%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(40% 36% at 18% 22%, rgba(56, 132, 222, 0.55), transparent 65%),
      radial-gradient(32% 30% at 82% 26%, rgba(168, 85, 247, 0.32), transparent 65%),
      radial-gradient(38% 34% at 50% 96%, rgba(56, 189, 248, 0.36), transparent 65%),
      radial-gradient(26% 24% at 92% 78%, rgba(244, 114, 182, 0.22), transparent 65%);
    filter: blur(60px) saturate(160%);
  }

  /* Grain overlay */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 1  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
    opacity: 0.07;
    mix-blend-mode: overlay;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wordmark {
    font-size: 280px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -14px;
    color: #f4f6fb;
    /* slight nudge so the optical centre of "quay." sits at the pfp centre */
    transform: translateX(-10px);
  }
  .wordmark .dot {
    color: #4DA2FF;
  }
</style>
</head>
<body>
  <div class="pfp">
    <div class="aurora"></div>
    <div class="grain"></div>
    <div class="content">
      <div class="wordmark">quay<span class="dot">.</span></div>
    </div>
  </div>
</body>
</html>
